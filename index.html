<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Orçamentos · rodrigo gondim</title>
  <style>
    /* ===================================================================
       Sistema visual do rgondim.com.br (tema rodrigo-portfolio-theme).
       Fontes, cores, raio e unidade de espaçamento vêm de lá.
       A INTERFACE é preta como o site. O DOCUMENTO da proposta segue
       branco — é papel, vai impresso e em PDF para o cliente.
       =================================================================== */

    @font-face { font-family: 'National 2'; src: url('assets/fonts/National2-Light.otf') format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'National 2'; src: url('assets/fonts/National2-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'National 2'; src: url('assets/fonts/National2-Medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'National 2'; src: url('assets/fonts/National2-Bold.otf') format('opentype'); font-weight: 700; font-display: swap; }

    :root {
      --rp-black: #000000;
      --rp-white: #ffffff;
      --rp-gray: #909090;
      --rp-blue: #004bf4;
      --rp-yellow: #ffbf01;
      --rp-red: #ff0700;
      --rp-green: #008858;
      --rp-pink: #f184d4;

      --rp-font: 'National 2', 'Helvetica Neue', Arial, sans-serif;
      --rp-radius: 20px;
      --rp-gap: 14px;

      --linha: rgba(255, 255, 255, 0.22);
      --campo: rgba(255, 255, 255, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--rp-black);
      color: var(--rp-white);
      font-family: var(--rp-font);
      /* a National 2 pesa visivelmente sem isto no macOS/Chrome */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    input, textarea, button { font-family: inherit; }
    button { cursor: pointer; transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s; }
    button:hover { opacity: 0.75; }

    .container { max-width: 1000px; margin: 0 auto; padding: 56px 28px 0; min-height: 100vh; }

    /* ---- Cabeçalho ---- */
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 56px; padding-bottom: 28px; border-bottom: 1px solid var(--linha); }
    h1 { font-size: 44px; font-weight: 500; margin: 0; letter-spacing: -0.02em; line-height: 1; }
    .subtitulo { font-size: 12px; color: var(--rp-green); margin: 10px 0 0 0; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 400; }
    h2 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.02em; }

    .header-right { display: flex; gap: 20px; align-items: flex-end; }
    .contador-box { display: flex; flex-direction: column; align-items: flex-end; padding-right: 20px; border-right: 1px solid var(--linha); }
    .contador-label { font-size: 11px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 4px; }
    .contador-num { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }

    /* ---- Seções e campos ---- */
    .secao { margin-bottom: 56px; }
    .secao-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--linha); }

    label { display: block; font-size: 11px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px; margin-top: 18px; }
    input, textarea {
      width: 100%; padding: 13px 16px;
      border: 1px solid var(--linha); border-radius: 10px;
      font-size: 15px; background: var(--campo); color: var(--rp-white);
      transition: border-color 0.15s, background 0.15s;
    }
    input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.3); }
    input:focus, textarea:focus { border-color: var(--rp-white) !important; background: rgba(255, 255, 255, 0.07) !important; outline: none; }
    textarea { resize: vertical; min-height: 68px; line-height: 1.5; }

    .cartao { padding: 28px; border: 1px solid var(--linha); border-radius: var(--rp-radius); margin-bottom: var(--rp-gap); background: rgba(255, 255, 255, 0.03); position: relative; }
    .cartao-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .cartao-num { font-size: 12px; color: var(--rp-gray); letter-spacing: 0.14em; }

    .linha-campos { display: flex; gap: var(--rp-gap); margin-bottom: 4px; }
    .linha-campos > div { flex: 1; }
    .linha-campos > .flex2 { flex: 2; }
    .linha-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

    /* ---- Botões (pílula, como os filtros da Work) ---- */
    .btn-add, .btn-secundario, .btn-primario, .btn-preview, .btn-add-inline {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 999px; letter-spacing: 0.02em; font-weight: 400;
    }
    .btn-add { padding: 9px 18px; border: 1px solid var(--linha); background: transparent; color: var(--rp-white); font-size: 13px; }
    .btn-add:hover { border-color: var(--rp-white); opacity: 1; }
    .btn-add-inline { padding: 6px 14px; border: 1px dashed rgba(255, 255, 255, 0.3); background: transparent; color: var(--rp-gray); font-size: 12px; }
    .btn-add-inline:hover { color: var(--rp-white); opacity: 1; }
    .btn-remover { border: none; background: transparent; color: var(--rp-gray); padding: 4px; font-size: 13px; }
    .btn-remover:hover { color: var(--rp-red); opacity: 1; }
    .btn-remover-icon { border: none; background: transparent; color: rgba(255, 255, 255, 0.35); padding: 6px; font-size: 15px; }
    .btn-remover-icon:hover { color: var(--rp-red); opacity: 1; }
    .btn-secundario { padding: 10px 20px; border: 1px solid var(--linha); background: transparent; color: var(--rp-white); font-size: 13px; }
    .btn-secundario:hover { border-color: var(--rp-white); opacity: 1; }
    .btn-primario { padding: 14px 30px; border: 1px solid var(--rp-white); background: var(--rp-white); color: var(--rp-black); font-size: 14px; font-weight: 500; }
    .btn-preview { padding: 16px 36px; border: 1px solid var(--rp-white); background: var(--rp-white); color: var(--rp-black); font-size: 14px; font-weight: 500; }
    .btn-primario:hover, .btn-preview:hover { background: transparent; color: var(--rp-white); opacity: 1; }
    .btn-link { border: none; background: none; color: var(--rp-gray); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    .btn-link:hover { color: var(--rp-white); opacity: 1; }

    /* ---- Histórico, edição e link ---- */
    .container-doc { padding-top: 0; padding-bottom: 56px; min-height: 0; }
    .historico-acoes { display: flex; gap: 14px; justify-content: flex-end; white-space: nowrap; }
    .btn-linha { border: none; background: none; color: var(--rp-gray); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
    .btn-linha:hover { color: var(--rp-white); opacity: 1; }

    .faixa-edicao { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 28px; border: 1px solid var(--rp-yellow); border-radius: var(--rp-radius); background: rgba(255,191,1,0.07); font-size: 13px; color: var(--rp-yellow); }
    .faixa-edicao strong { font-weight: 500; }
    .faixa-edicao .btn-linha { color: var(--rp-yellow); }
    .faixa-edicao .btn-linha:hover { color: var(--rp-white); }

    .pronta-dica { font-size: 14px; color: var(--rp-gray); margin-top: 12px; line-height: 1.6; }
    .pronta-dica code { font-size: 12px; background: rgba(255,255,255,0.08); padding: 3px 9px; border-radius: 6px; }
    .pronta-acoes { display: flex; gap: 12px; margin-top: 28px; justify-content: center; }

    .link-box { margin: 32px auto 0; max-width: 560px; text-align: left; padding-top: 24px; border-top: 1px solid var(--linha); }
    .link-box-label { font-size: 11px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 10px; }
    .link-box-linha { display: flex; gap: 10px; }
    .link-box-linha input { font-size: 13px; }
    .link-box-obs { font-size: 12px; color: var(--rp-gray); margin: 10px 0 0 0; line-height: 1.5; }

    /* .container tem min-height: 100vh. Como esta barra e um .container e vira
       flex, o align-items: stretch padrao esticava o botao pela altura da tela
       inteira. Dai o min-height: 0 e o align-items. */
    .barra-compartilhada { display: flex; justify-content: flex-end; align-items: flex-start; min-height: 0; padding-top: 28px; padding-bottom: 18px; }

    /* ---- Templates de projeto ---- */
    .templates { margin-bottom: 42px; }
    .templates-linha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .templates-label { font-size: 11px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.14em; margin-right: 4px; }
    .btn-add.is-ativo { background: var(--rp-white); color: var(--rp-black); border-color: var(--rp-white); }

    .template-painel { display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px; margin-top: 18px; padding: 26px; border: 1px solid var(--linha); border-radius: var(--rp-radius); background: rgba(255,255,255,0.03); }
    .template-modulos { display: flex; flex-direction: column; gap: 2px; }
    /* .template-modulo e um <label>, entao precisa anular a regra global de
       label (caixa alta, tracking, cor e margens) que vale pros campos do form */
    .template-modulo { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: start; padding: 9px 10px; border-radius: 10px; cursor: pointer; text-transform: none; letter-spacing: normal; color: var(--rp-white); font-size: 14px; margin: 0; }
    .template-modulo:hover { background: rgba(255,255,255,0.05); }
    .template-modulo.is-fixo { cursor: default; opacity: 0.6; }
    .template-modulo.is-fixo:hover { background: transparent; }
    .template-modulo input { width: 15px; height: 15px; margin: 2px 0 0 0; accent-color: var(--rp-green); }
    .template-modulo-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .template-modulo-rotulo { font-size: 14px; color: var(--rp-white); }
    .template-modulo-conteudo { font-size: 11.5px; color: var(--rp-gray); line-height: 1.4; }
    .template-modulo-dias { font-size: 12px; color: var(--rp-gray); white-space: nowrap; padding-top: 2px; }

    .template-variante { font-size: 13px; color: var(--rp-gray); letter-spacing: 0.02em; }
    .template-resumo { display: flex; flex-direction: column; gap: 14px; }
    .template-prazo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--linha); margin-top: -6px; }
    .template-prazo-num { font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
    .template-prazo-label { font-size: 13px; color: var(--rp-gray); }
    .template-prazo-obs { font-size: 11px; color: var(--rp-yellow); width: 100%; margin-top: 2px; }

    .template-refs-label { font-size: 11px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 10px; }
    .template-ref { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
    .template-ref-valor { font-weight: 500; color: var(--rp-white); }
    .template-refs-obs { font-size: 11px; color: var(--rp-gray); line-height: 1.5; margin: 10px 0 0 0; }

    @media (max-width: 900px) {
      .template-painel { grid-template-columns: 1fr; }
    }

    .rodape-acoes { display: flex; justify-content: flex-end; padding: 28px 0 56px; border-top: 1px solid var(--linha); margin-top: 56px; }
    .seletor-exemplo { margin-bottom: 28px; text-align: right; }

    /* ---- Avisos (amarelo da marca) ---- */
    .aviso-erro { padding: 22px 24px; background: rgba(255, 191, 1, 0.08); border: 1px solid var(--rp-yellow); border-radius: var(--rp-radius); margin-bottom: 28px; }
    .aviso-erro-titulo { font-size: 16px; color: var(--rp-yellow); font-weight: 500; }
    .aviso-erro-texto { font-size: 14px; color: rgba(255, 255, 255, 0.8); line-height: 1.55; margin: 6px 0 14px 0; }
    .aviso-erro-link { font-size: 13px; color: var(--rp-yellow); text-decoration: underline; text-underline-offset: 3px; }
    .aviso-erro-fechar { border: none; background: transparent; color: var(--rp-yellow); font-size: 22px; padding: 0; line-height: 1; }

    .preview-box { border: 1px solid var(--linha); border-radius: var(--rp-radius); background: var(--rp-black); overflow: auto; }
    .proposta-pronta-box { text-align: center; padding: 64px 20px; border: 1px solid var(--linha); border-radius: var(--rp-radius); background: rgba(255, 255, 255, 0.03); margin-bottom: 40px; }
    .selo { width: 60px; height: 60px; border-radius: 50%; background: var(--rp-green); color: var(--rp-white); font-size: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }

    /* ---- Tabela do histórico ---- */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 14px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--rp-gray); border-bottom: 1px solid var(--linha); font-weight: 400; }
    tr { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    td { padding: 16px 10px; font-size: 15px; }

    /* ===================================================================
       Documento da proposta — mesma identidade do rgondim.com.br:
       preto, National 2 e as 5 cores de marca codificando as seções.
       print-color-adjust: exact é obrigatório — sem ele o navegador
       descarta o fundo preto na impressão/PDF e o texto branco some.
       =================================================================== */
    .pagina {
      width: 210mm; min-height: 297mm; padding: 20mm;
      background: var(--rp-black); color: var(--rp-white);
      font-family: var(--rp-font); font-size: 11px; line-height: 1.5;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .doc-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 20px; border-bottom: 1px solid var(--rp-white); margin-bottom: 34px; }
    .doc-marca { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .doc-amp { width: 30px; height: 30px; flex: none; display: block; }
    .doc-logo { font-size: 30px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
    .doc-contato { font-size: 10px; color: var(--rp-gray); line-height: 1.7; margin-top: 14px; }
    .doc-proposta-box { text-align: right; }
    .doc-proposta-num { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--rp-gray); }
    .doc-proposta-num-big { font-size: 26px; font-weight: 500; margin-top: 4px; letter-spacing: -0.02em; }
    .doc-proposta-data { font-size: 10px; color: var(--rp-gray); margin-top: 10px; }
    .doc-secao { margin-bottom: 34px; }

    /* Labels coloridos por seção — mesma convenção do bloco de info do About */
    .doc-secao-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 12px; color: var(--rp-green); }
    .doc-secao-label--green  { color: var(--rp-green); }
    .doc-secao-label--blue   { color: var(--rp-blue); }
    .doc-secao-label--yellow { color: var(--rp-yellow); }
    .doc-secao-label--pink   { color: var(--rp-pink); }
    .doc-secao-label--red    { color: var(--rp-red); }

    .doc-proposta-para { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.25); display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; }
    .doc-proposta-para-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--rp-gray); }
    .doc-proposta-para-nome { font-size: 17px; font-weight: 500; letter-spacing: -0.02em; }
    .doc-apresentacao-txt { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.85); margin: 0; max-width: 82%; }

    /* Bloco fixo: apresentação, premiações e metodologia */
    .doc-manifesto { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.85); max-width: 88%; margin: 0 0 32px 0; }
    .doc-manifesto p { margin: 0 0 10px 0; }
    .doc-manifesto p:last-child { margin-bottom: 0; }
    .doc-premiacoes { columns: 2; column-gap: 34px; font-size: 11px; margin-bottom: 36px; }
    .doc-premiacao { break-inside: avoid; margin-bottom: 9px; }
    .doc-premiacao-titulo { display: block; font-weight: 500; color: var(--rp-white); line-height: 1.35; }
    .doc-premiacao-detalhe { display: block; font-size: 10px; color: var(--rp-gray); line-height: 1.35; }
    .doc-metodologia { break-inside: avoid; page-break-inside: avoid; }
    .doc-metodo-grade { margin-bottom: 26px; }
    .doc-metodo-linha { display: grid; grid-template-columns: 124px 1fr; align-items: center; gap: 16px; margin-bottom: 10px; }
    .doc-metodo-nome { font-size: 11px; letter-spacing: 0.01em; color: var(--rp-white); }
    .doc-metodo-nome b { font-weight: 500; }
    .doc-metodo-trilha { display: grid; grid-template-columns: repeat(10, 1fr); align-items: center; }
    .doc-metodo-passo { position: relative; display: flex; justify-content: center; align-items: center; height: 10px; }
    .doc-metodo-passo::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.45); }
    .doc-metodo-passo:first-child::before { left: 50%; }
    .doc-metodo-passo:last-child::before { right: 50%; }
    /* vazio = contorno branco; preenchido = cor da fase (ordem fixa do site:
       green, blue, yellow, pink, red — a mesma do marquee da home) */
    .doc-metodo-quadro { position: relative; width: 8px; height: 8px; border: 1px solid var(--rp-white); background: var(--rp-black); }
    .doc-metodo-quadro.ativo { background: var(--fase); border-color: var(--fase); }
    .doc-metodo-letra { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--fase); color: var(--fase); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; }
    /* fluxo por coluna: A,B,C na esquerda e D,E na direita, como no modelo impresso */
    .doc-metodo-etapas { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: 16px 34px; }
    .doc-metodo-etapa { display: grid; grid-template-columns: 18px 1fr; gap: 10px; break-inside: avoid; }
    .doc-metodo-txt { font-size: 10.5px; line-height: 1.5; color: rgba(255,255,255,0.75); margin: 0; }
    .doc-metodo-txt strong { font-weight: 500; color: var(--rp-white); }

    .doc-servico { padding-top: 24px; padding-bottom: 24px; border-top: 1px solid var(--rp-white); }
    .doc-servico-header { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 18px; align-items: baseline; margin-bottom: 10px; }
    .doc-servico-num { font-size: 11px; color: var(--rp-gray); letter-spacing: 0.14em; }
    .doc-servico-titulo { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
    .doc-servico-prazo { font-size: 10px; color: var(--rp-gray); text-transform: uppercase; letter-spacing: 0.12em; white-space: nowrap; }
    .doc-servico-valor { font-size: 16px; font-weight: 500; white-space: nowrap; letter-spacing: -0.01em; }
    .doc-servico-parcelas { color: var(--rp-gray); font-size: 10px; font-weight: 400; letter-spacing: 0; }
    .doc-servico-desc { font-size: 11px; color: rgba(255,255,255,0.75); margin-left: 50px; margin-bottom: 14px; margin-top: 0; max-width: 85%; }
    .doc-itens-lista { margin-left: 50px; }
    .doc-item { display: grid; grid-template-columns: 150px 1fr; gap: 16px; margin-bottom: 7px; font-size: 11px; align-items: baseline; }
    .doc-item-rotulo { color: var(--rp-gray); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; padding-top: 2px; }
    .doc-item-conteudo { color: var(--rp-white); line-height: 1.5; }
    .doc-cronograma-intro { font-size: 10.5px; color: var(--rp-gray); max-width: 75%; margin-bottom: 16px; }
    .doc-cronograma-linha { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.18); font-size: 11px; }
    .doc-cronograma-etapa { color: rgba(255,255,255,0.9); flex: 1; padding-right: 16px; }
    .doc-cronograma-duracao { color: var(--rp-gray); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; white-space: nowrap; }
    .doc-observacoes { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--rp-white); }
    .doc-obs-bloco { margin-bottom: 18px; }
    .doc-obs-titulo { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 6px; font-weight: 500; color: var(--rp-white); }
    .doc-obs-txt { font-size: 10.5px; color: rgba(255,255,255,0.72); line-height: 1.55; margin: 0; }

    /* ===== Impressão ===== */
    @media print {
      @page { size: A4; margin: 0; }
      /* sem isto o navegador joga fora o fundo preto e o texto branco some */
      #area-impressao, #area-impressao * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body * { visibility: hidden; }
      #area-impressao, #area-impressao * { visibility: visible; }
      #area-impressao { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
      .preview-box { border: none; border-radius: 0; box-shadow: none; }
      .pagina { box-shadow: none; }
    }

    /* ===== Telas estreitas ===== */
    @media (max-width: 900px) {
      .container { padding: 32px 14px 0; }
      .header { flex-direction: column; align-items: flex-start; gap: 20px; }
      h1 { font-size: 34px; }
      .linha-campos { flex-direction: column; gap: 0; }
    }
  </style>

    // Enquanto os valores acima forem os placeholders, nem tenta chamar a API:

    function supabaseConfigurado() {
      return SUPABASE_URL.startsWith("https://") && !SUPABASE_KEY.startsWith("COLE_AQUI");
    }

    // As chaves novas do Supabase (sb_publishable_...) NAO sao JWT e devem ir
    // apenas no header apikey. As antigas (anon, comecando com "eyJ") continuam
    // precisando tambem do Authorization: Bearer. Esta funcao cobre os dois casos.
    function cabecalhosSupabase(extra = {}) {
      const ehJWT = SUPABASE_KEY.startsWith("eyJ");
      return {
        apikey: SUPABASE_KEY,
        ...(ehJWT ? { Authorization: `Bearer ${SUPABASE_KEY}` } : {}),
        "Content-Type": "application/json",
        ...extra,
      };
    }

    async function sb(path, options = {}) {
      if (!supabaseConfigurado()) throw new Error("NAO_CONFIGURADO");
      let res;
      try {
        res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
          ...options,
          headers: cabecalhosSupabase({
            Prefer: "return=representation",
            ...(options.headers || {}),
          }),
        });
      } catch (e) {
        throw new Error("CONEXAO_FALHOU");
      }
      if (!res.ok) {
        const texto = await res.text();
        if (res.status === 403 && texto.includes("allowlist")) throw new Error("ALLOWLIST");
        throw new Error(`Supabase ${res.status}: ${texto}`);
      }
      return res.json();
    }

    async function obterProximoNumero() {

      try {
        res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/obter_proximo_numero_proposta`, {
          method: "POST",
          headers: cabecalhosSupabase(),
          body: "{}",
        });
      } catch (e) { throw new Error("CONEXAO_FALHOU"); }
      if (!res.ok) {
        const texto = await res.text();
        if (res.status === 403 && texto.includes("allowlist")) throw new Error("ALLOWLIST");
        throw new Error("Falha ao obter número");
      }
      return res.json();
    }

    // Arredonda pra cima no multiplo de 5 — nunca prometer menos prazo do que a conta deu.
    function arredondarPrazo(dias) { return Math.ceil(dias / 5) * 5; }

    // O titulo do servico muda conforme os modulos escolhidos: a primeira
    // variante cujos modulos estejam TODOS marcados vence.
    function tituloDoTemplate(template, marcados) {
      const v = (template.variantes || []).find((v) => v.requer.every((id) => marcados[id]));
      return v ? v.titulo : (template.tituloPadrao || template.nome);
    }

    function montarTemplate(template, marcados) {
      const escolhidos = template.modulos.filter((m) => marcados[m.id]);
      const dias = escolhidos.reduce((t, m) => t + m.dias, 0) +
                   template.etapasFixas.reduce((t, e) => t + e.dias, 0);
      const prazo = arredondarPrazo(dias);

      // notas sem "requer" valem sempre; com "requer", so se o modulo entrou
      const notas = (template.observacoes || [])
        .filter((o) => !o.requer || marcados[o.requer])
        .map((o) => o.texto);
      const descricao = [template.descricao, ...notas].filter(Boolean).join(" ");

      const servico = {
        titulo: tituloDoTemplate(template, marcados),
        prazo: `${prazo} dias úteis`,
        valor: "",
        parcelas: "50% no início e 50% na entrega",
        descricao,
        itens: escolhidos.map((m) => ({ rotulo: m.rotulo, conteudo: m.conteudo })),
      };

      // modulos que dividem a mesma etapa viram uma linha so, somando os dias
      const porEtapa = [];
      escolhidos.forEach((m) => {
        const existente = porEtapa.find((e) => e.nome === m.etapa);
        if (existente) existente.dias += m.dias;
        else porEtapa.push({ nome: m.etapa, dias: m.dias });
      });
      template.etapasFixas.forEach((e) => porEtapa.push({ nome: e.nome, dias: e.dias }));

      const etapas = porEtapa.map((e) => ({ nome: e.nome, duracao: `${e.dias} dias úteis` }));
      return { servico, etapas, diasBrutos: dias, prazo };
    }

    // Junta o cronograma de um template novo ao que ja existe. Etapas de mesmo
    // nome somam os dias em vez de duplicar a linha — o caso de empilhar dois
    // templates que compartilham uma etapa (revisoes, por exemplo).
    // Se a duracao ja tiver sido editada a mao e nao comecar com um numero,
    // preserva o texto do usuario e acrescenta como linha separada.
    function juntarCronograma(atual, novas) {
      const saida = atual.map((e) => ({ ...e }));
      novas.forEach((nova) => {
        const existente = saida.find((e) => e.nome === nova.nome);
        const diasExistente = parseInt(existente && existente.duracao, 10);
        const diasNova = parseInt(nova.duracao, 10);
        if (existente && Number.isFinite(diasExistente) && Number.isFinite(diasNova)) {
          existente.duracao = `${diasExistente + diasNova} dias úteis`;
        } else {
          saida.push({ ...nova });
        }
      });
      return saida;
    }

    function criarServicoVazio() {
      return { titulo: "", prazo: "", valor: "", parcelas: "", descricao: "", itens: [{ rotulo: "", conteudo: "" }] };
    }
    function criarEtapaVazia() { return { nome: "", duracao: "" }; }

    // ============ App ============
    function App() {
      const [tela, setTela] = useState("form");
      const [cliente, setCliente] = useState("");
      const [apresentacao, setApresentacao] = useState("");
      const [validadeDias, setValidadeDias] = useState(30);
      const [servicos, setServicos] = useState([criarServicoVazio()]);
      const [cronograma, setCronograma] = useState([criarEtapaVazia()]);
      const [proximoNum, setProximoNum] = useState(null);
      const [historico, setHistorico] = useState([]);
      const [gerando, setGerando] = useState(false);
      const [erro, setErro] = useState(null);
      const [propostaFinal, setPropostaFinal] = useState(null);
      // null = proposta nova. Preenchido = reabrindo uma do historico para
      // editar, mantendo id, numero e data originais.
      const [editando, setEditando] = useState(null);

      useEffect(() => {
        sb("proposta_contador?select=proximo_numero&id=eq.1")
          .then((rows) => setProximoNum(rows[0]?.proximo_numero || 12))
          .catch((e) => setErro(e.message));
      }, []);

      function atualizarServico(idx, campo, valor) {
        const novo = [...servicos];
        novo[idx] = { ...novo[idx], [campo]: valor };
        setServicos(novo);
      }
      function atualizarItemServico(sIdx, iIdx, campo, valor) {
        const novo = [...servicos];
        novo[sIdx].itens[iIdx] = { ...novo[sIdx].itens[iIdx], [campo]: valor };
        setServicos(novo);
      }
      function adicionarItemServico(sIdx) {
        const novo = [...servicos];
        novo[sIdx].itens.push({ rotulo: "", conteudo: "" });
        setServicos(novo);
      }
      function removerItemServico(sIdx, iIdx) {
        const novo = [...servicos];
        novo[sIdx].itens = novo[sIdx].itens.filter((_, i) => i !== iIdx);
        setServicos(novo);
      }
      function adicionarServico() { setServicos([...servicos, criarServicoVazio()]); }

      function aplicarTemplate(servico, etapas) {
        // se o formulario ainda esta em branco, substitui em vez de acrescentar
        const servicoEmBranco = servicos.length === 1 && !servicos[0].titulo && !servicos[0].valor;
        setServicos(servicoEmBranco ? [servico] : [...servicos, servico]);
        const cronogramaEmBranco = cronograma.length === 1 && !cronograma[0].nome;
        setCronograma(cronogramaEmBranco ? etapas : juntarCronograma(cronograma, etapas));
      }
      function removerServico(idx) { setServicos(servicos.filter((_, i) => i !== idx)); }
      function atualizarEtapa(idx, campo, valor) {
        const novo = [...cronograma];
        novo[idx] = { ...novo[idx], [campo]: valor };
        setCronograma(novo);
      }
      function adicionarEtapa() { setCronograma([...cronograma, criarEtapaVazia()]); }
      function removerEtapa(idx) { setCronograma(cronograma.filter((_, i) => i !== idx)); }

      async function carregarHistorico() {
        try {
          const rows = await sb("propostas_geradas?select=*&order=criado_em.desc&limit=50");
          setHistorico(rows);
          setTela("historico");
        } catch (e) { setErro(e.message); }
      }

      async function confirmarEsalvar() {
        setGerando(true);
        setErro(null);
        try {
          const valorTotal = servicos.reduce((s, sv) => s + (parseFloat(sv.valor) || 0), 0);
          const campos = {
            cliente: cliente || "sem nome", apresentacao, servicos, cronograma,
            validade_dias: validadeDias, valor_total: valorTotal,
          };

          let linha, numeroFmt;
          if (editando) {
            // regrava a mesma linha: o numero ja foi para o cliente, nao muda
            numeroFmt = editando.numero_proposta;
            const resp = await sb(`propostas_geradas?id=eq.${editando.id}`, {
              method: "PATCH", body: JSON.stringify(campos),
            });
            linha = Array.isArray(resp) ? resp[0] : resp;
          } else {
            const numero = await obterProximoNumero();
            const ano = new Date().getFullYear();
            numeroFmt = numeroProposta(numero, ano);
            const resp = await sb("propostas_geradas", {
              method: "POST",
              body: JSON.stringify({ numero_proposta: numeroFmt, ano, ...campos }),
            });
            linha = Array.isArray(resp) ? resp[0] : resp;
            setProximoNum(numero + 1);
          }

          setPropostaFinal({
            id: linha && linha.id, numeroFmt, cliente, apresentacao, servicos,
            cronograma, validadeDias, data: linha && linha.criado_em,
          });
          setEditando(null);
          setTela("pronto");
        } catch (e) { setErro(e.message); } finally { setGerando(false); }
      }

      function carregarDoHistorico(p, modo) {
        setCliente(modo === "duplicar" ? "" : (p.cliente || ""));
        setApresentacao(p.apresentacao || "");
        setValidadeDias(p.validade_dias || 30);
        setServicos(p.servicos && p.servicos.length ? p.servicos : [criarServicoVazio()]);
        setCronograma(p.cronograma && p.cronograma.length ? p.cronograma : [criarEtapaVazia()]);
        // duplicar = proposta nova, ganha numero novo ao salvar
        setEditando(modo === "editar"
          ? { id: p.id, numero_proposta: p.numero_proposta, ano: p.ano }
          : null);
        setErro(null);
        setTela("form");
      }

      function temDadosPreenchidos() {
        if (cliente || apresentacao) return true;
        if (servicos.some(s => s.titulo || s.valor || s.descricao || s.itens.some(i => i.rotulo || i.conteudo))) return true;
        if (cronograma.some(c => c.nome || c.duracao)) return true;
        return false;
      }

      function zerarFormulario() {
        if (temDadosPreenchidos() && !window.confirm("Tem certeza que deseja zerar todos os campos? Isso não pode ser desfeito.")) return;
        setCliente(""); setApresentacao(""); setValidadeDias(30);
        setServicos([criarServicoVazio()]); setCronograma([criarEtapaVazia()]);
        setErro(null);
      }

      function preencherExemplo() {
        setCliente("Unkê");
        setApresentacao("Criação de material gráfico de sinalização para obra e escritório, além de uniforme, seguindo as diretrizes de identidade visuais já estabelecidas em brandbook do cliente.");
        setValidadeDias(30);
        setServicos([
          {
            titulo: "Sinalização",
            prazo: "7 dias úteis",
            valor: "1500",
            parcelas: "50% no início e 50% na entrega",
            descricao: "Criação de layouts em tamanho real para impressão de placas de obra e escritório, seguindo direcionamentos do brandbook do cliente. Criação de ícones conforme necessário.",
            itens: [
              { rotulo: "sinalização obras", conteudo: "7 placas" },
              { rotulo: "sinalização escritório", conteudo: "3 placas" },
            ],
          },
          {
            titulo: "Uniforme",
            prazo: "3 dias úteis",
            valor: "400",
            parcelas: "50% no início e 50% na entrega",
            descricao: "Criação de layout para uniforme.",
            itens: [{ rotulo: "", conteudo: "" }],
          },
        ]);
        setCronograma([
          { nome: "Criação", duracao: "10 dias úteis" },
        ]);
      }

      if (tela === "historico") return <TelaHistorico historico={historico} onVoltar={() => setTela("form")} onCarregar={carregarDoHistorico} />;

      if (tela === "pronto") {
        return <TelaPronta proposta={propostaFinal} onNova={() => {
          setPropostaFinal(null);
          setCliente(""); setApresentacao(""); setValidadeDias(30);
          setServicos([criarServicoVazio()]); setCronograma([criarEtapaVazia()]);
          setTela("form");
        }} />;
      }

      if (tela === "preview") {
        return (
          <div>
            <div className="container no-print" style={{ paddingTop: 20, paddingBottom: 0 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20, gap: 12 }}>
                <button className="btn-secundario" onClick={() => setTela("form")}>← voltar e editar</button>
                <button className="btn-primario" onClick={confirmarEsalvar} disabled={gerando} style={{ opacity: gerando ? 0.5 : 1 }}>
                  ⬇ {gerando ? "salvando..." : (editando
                       ? `regravar ${editando.numero_proposta}`
                       : `confirmar ${numeroProposta(proximoNum, new Date().getFullYear())}`)}
                </button>
              </div>
              {erro && <AvisoErro erro={erro} onFechar={() => setErro(null)} />}
            </div>

            {/* mesmo motivo da TelaPronta: o documento precisa ficar fora de
                qualquer ancestral .no-print, senao o print sai em branco */}
            <div className="container container-doc">
              <div className="preview-box">
                <div id="area-impressao">
                  <PropostaRender
                    numeroFmt={editando ? editando.numero_proposta : numeroProposta(proximoNum, new Date().getFullYear())}
                    cliente={cliente} apresentacao={apresentacao} servicos={servicos}
                    cronograma={cronograma} validadeDias={validadeDias} />
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <header className="header">
            <div>
              <h1>Gerador de Orçamentos</h1>
              <p className="subtitulo">rodrigo gondim</p>
            </div>
            <div className="header-right">
              <div className="contador-box">
                <span className="contador-label">próxima</span>
                <span className="contador-num">
                  {proximoNum ? numeroProposta(proximoNum, new Date().getFullYear()) : "—"}
                </span>
              </div>
              <button className="btn-secundario" onClick={zerarFormulario}>↺ zerar</button>
              <button className="btn-secundario" onClick={carregarHistorico}>⏲ histórico</button>
            </div>
          </header>

          {erro && <AvisoErro erro={erro} onFechar={() => setErro(null)} />}

          <div className="seletor-exemplo">
            <button className="btn-link" onClick={preencherExemplo}>carregar proposta Unkê →</button>
          </div>

          <section className="secao">
            <label>cliente</label>
            <input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente ou projeto" />

            <label>apresentação resumida</label>
            <textarea value={apresentacao} onChange={(e) => setApresentacao(e.target.value)} placeholder="Texto de apresentação do projeto..." rows={3} />

            <label>validade (dias)</label>
            <input type="number" style={{width: 140}} value={validadeDias} onChange={(e) => setValidadeDias(parseInt(e.target.value) || 30)} />
          </section>

          {editando && (
            <div className="faixa-edicao">
              <span>
                editando a proposta <strong>{editando.numero_proposta}</strong> — regravar mantém
                o número e a data originais
              </span>
              <button className="btn-linha" onClick={() => setEditando(null)}>
                salvar como proposta nova
              </button>
            </div>
          )}

          <PainelTemplates onAplicar={aplicarTemplate} />

          <section className="secao">
            <div className="secao-header">
              <h2>Serviços</h2>
              <button className="btn-add" onClick={adicionarServico}>+ serviço</button>
            </div>

            {servicos.map((sv, sIdx) => (
              <div key={sIdx} className="cartao">
                <div className="cartao-header">
                  <span className="cartao-num">{String(sIdx + 1).padStart(2, "0")}</span>
                  {servicos.length > 1 && <button className="btn-remover" onClick={() => removerServico(sIdx)}>✕</button>}
                </div>

                <div className="linha-campos">
                  <div className="flex2">
                    <label>título</label>
                    <input value={sv.titulo} onChange={(e) => atualizarServico(sIdx, "titulo", e.target.value)} placeholder="Design de Identidade" />
                  </div>
                  <div>
                    <label>prazo</label>
                    <input value={sv.prazo} onChange={(e) => atualizarServico(sIdx, "prazo", e.target.value)} placeholder="35 dias úteis" />
                  </div>
                </div>

                <div className="linha-campos">
                  <div>
                    <label>valor (R$)</label>
                    <input type="number" step="0.01" value={sv.valor} onChange={(e) => atualizarServico(sIdx, "valor", e.target.value)} placeholder="8000" />
                  </div>
                  <div>
                    <label>parcelas</label>
                    <input value={sv.parcelas} onChange={(e) => atualizarServico(sIdx, "parcelas", e.target.value)} placeholder="1+2 vezes" />
                  </div>
                </div>

                <label>descrição</label>
                <textarea value={sv.descricao} onChange={(e) => atualizarServico(sIdx, "descricao", e.target.value)} placeholder="Descrição do serviço..." rows={2} />

                <div style={{ marginTop: 18 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <label style={{marginBottom: 0, marginTop: 0}}>entregáveis</label>
                    <button className="btn-add-inline" onClick={() => adicionarItemServico(sIdx)}>+ item</button>
                  </div>
                  {sv.itens.map((item, iIdx) => (
                    <div key={iIdx} className="linha-item">
                      <input style={{flex: 1}} value={item.rotulo} onChange={(e) => atualizarItemServico(sIdx, iIdx, "rotulo", e.target.value)} placeholder="rótulo" />
                      <input style={{flex: 3}} value={item.conteudo} onChange={(e) => atualizarItemServico(sIdx, iIdx, "conteudo", e.target.value)} placeholder="conteúdo" />
                      {sv.itens.length > 1 && <button className="btn-remover-icon" onClick={() => removerItemServico(sIdx, iIdx)}>✕</button>}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </section>

          <section className="secao">
            <div className="secao-header">
              <h2>Cronograma</h2>
              <button className="btn-add" onClick={adicionarEtapa}>+ etapa</button>
            </div>

            {cronograma.map((et, idx) => (
              <div key={idx} className="linha-item">
                <input style={{flex: 3}} value={et.nome} onChange={(e) => atualizarEtapa(idx, "nome", e.target.value)} placeholder="Nome da etapa" />
                <input style={{flex: 1}} value={et.duracao} onChange={(e) => atualizarEtapa(idx, "duracao", e.target.value)} placeholder="05 dias úteis" />
                {cronograma.length > 1 && <button className="btn-remover-icon" onClick={() => removerEtapa(idx)}>✕</button>}
              </div>
            ))}
          </section>

          <div className="rodape-acoes">
            <button className="btn-preview" onClick={() => setTela("preview")}>◉ visualizar proposta</button>
          </div>
        </div>
      );
    }

    function TelaPronta({ proposta, onNova }) {
      // Padronizar nome do arquivo: 0012_2026_NomeDoCliente
      const [numero, ano] = proposta.numeroFmt.split("/");
      const nomeCliente = (proposta.cliente || "sem-nome")
        .trim()
        .replace(/\s+/g, "_")
        .replace(/[\/\\:*?"<>|]/g, "");
      const nomeArquivo = `${numero}_${ano}_${nomeCliente}`;

      // O navegador usa o title da aba como sugestao de nome ao salvar o PDF
      useEffect(() => {
        const tituloOriginal = document.title;
        document.title = nomeArquivo;
        return () => { document.title = tituloOriginal; };
      }, [nomeArquivo]);

      return (
        <div>
          <div className="container no-print">
            <div className="proposta-pronta-box">
              <div className="selo">✓</div>
              <h1 style={{ fontSize: 32 }}>Proposta {proposta.numeroFmt} salva</h1>
              <p className="pronta-dica">
                Para gerar o PDF, clique em imprimir e escolha “Salvar como PDF”.
                O nome sugerido será <code>{nomeArquivo}.pdf</code>.
              </p>
              <div className="pronta-acoes">
                <button className="btn-primario" onClick={() => window.print()}>⎙ imprimir / salvar PDF</button>
                <button className="btn-secundario" onClick={onNova}>nova proposta</button>
              </div>
              {proposta.id && <LinkCompartilhavel id={proposta.id} />}
            </div>
          </div>

          {/* Fica FORA do .container.no-print de proposito. No @media print o
              .no-print vira display:none, e display:none no ancestral apaga a
              subarvore inteira — visibility:visible no filho nao ressuscita.
              Era esse o motivo do PDF sair em branco. */}
          <div className="container container-doc">
            <div className="preview-box">
              <div id="area-impressao">
                <PropostaRender {...proposta} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    function urlDaProposta(id) {
      return `${location.origin}${location.pathname}?p=${id}`;
    }

    function LinkCompartilhavel({ id, compacto }) {
      const [copiado, setCopiado] = useState(false);
      const url = urlDaProposta(id);

      async function copiar() {
        try {
          await navigator.clipboard.writeText(url);
        } catch (e) {
          // clipboard bloqueado (http sem localhost, permissao negada): cai no prompt
          window.prompt("Copie o link:", url);
          return;
        }
        setCopiado(true);
        setTimeout(() => setCopiado(false), 2000);
      }

      if (compacto) {
        return <button className="btn-linha" onClick={copiar}>{copiado ? "copiado ✓" : "link"}</button>;
      }
      return (
        <div className="link-box">
          <div className="link-box-label">link para o cliente</div>
          <div className="link-box-linha">
            <input readOnly value={url} onFocus={(e) => e.target.select()} />
            <button className="btn-secundario" onClick={copiar}>{copiado ? "copiado ✓" : "copiar"}</button>
          </div>
          <p className="link-box-obs">
            Abre só a proposta, sem o gerador. Quem tiver o link vê o documento.
          </p>
        </div>
      );
    }

    function TelaHistorico({ historico, onVoltar, onCarregar }) {
      return (
        <div className="container">
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 32, alignItems: "baseline" }}>
            <h1>Histórico</h1>
            <button className="btn-secundario" onClick={onVoltar}>← voltar</button>
          </div>
          {historico.length === 0 ? (
            <p style={{ color: "var(--rp-gray)" }}>Nenhuma proposta gerada ainda.</p>
          ) : (
            <table>
              <thead>
                <tr><th>nº</th><th>cliente</th><th>valor</th><th>data</th><th></th></tr>
              </thead>
              <tbody>
                {historico.map((p) => (
                  <tr key={p.id}>
                    <td><code style={{ fontSize: 13, letterSpacing: "0.04em" }}>{p.numero_proposta}</code></td>
                    <td>{p.cliente}</td>
                    <td style={{ fontSize: 14, fontWeight: 500 }}>{formatarValor(p.valor_total)}</td>
                    <td style={{ color: "var(--rp-gray)", fontSize: 13 }}>
                      {new Date(p.criado_em).toLocaleDateString("pt-BR")}
                    </td>
                    <td className="historico-acoes">
                      <button className="btn-linha" onClick={() => onCarregar(p, "editar")}>editar</button>
                      <button className="btn-linha" onClick={() => onCarregar(p, "duplicar")}>usar de base</button>
                      <LinkCompartilhavel id={p.id} compacto />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    function PropostaRender({ numeroFmt, cliente, apresentacao, servicos, cronograma, validadeDias, data }) {
      // "data" so vem em proposta salva/reaberta. Sem ela (preview de proposta
      // nova) cai em hoje. Sem isso uma proposta antiga reaberta — ou aberta
      // pelo link — mostraria a data de hoje no cabecalho.
      return (
        <div className="pagina">
          <header className="doc-cabecalho">
            <div>
              <div className="doc-marca">
                <Ampersand />
                <span className="doc-logo">{DADOS_FIXOS.nome}</span>
              </div>
              <div className="doc-contato">T {DADOS_FIXOS.telefone}<br />{DADOS_FIXOS.email}</div>
            </div>
            <div className="doc-proposta-box">
              <div className="doc-proposta-num">proposta</div>
              <div className="doc-proposta-num-big">nº {numeroFmt}</div>
              <div className="doc-proposta-data">{formatarData(data ? new Date(data) : new Date())}</div>
              {cliente && (
                <div className="doc-proposta-para">
                  <span className="doc-proposta-para-label">para</span>
                  <span className="doc-proposta-para-nome">{cliente}</span>
                </div>
              )}
            </div>
          </header>

          {/* sem texto, o rotulo ficaria orfao sobre um vazio */}
          {apresentacao && apresentacao.trim() && (
            <section className="doc-secao">
              <div className="doc-secao-label doc-secao-label--green">apresentação</div>
              <p className="doc-apresentacao-txt">{apresentacao}</p>
            </section>
          )}

          <section className="doc-secao">
            <div className="doc-manifesto">
              {BIO.map((paragrafo, i) => <p key={i}>{paragrafo}</p>)}
            </div>

            <div className="doc-secao-label doc-secao-label--blue">principais premiações</div>
            <div className="doc-premiacoes">
              {PREMIACOES.map((premio, i) => (
                <div key={i} className="doc-premiacao">
                  <span className="doc-premiacao-titulo">{premio.titulo}</span>
                  <span className="doc-premiacao-detalhe">{premio.detalhe}</span>
                </div>
              ))}
            </div>

            <div className="doc-metodologia">
              <div className="doc-secao-label doc-secao-label--yellow">metodologia sem receita</div>

              <div className="doc-metodo-grade">
                {METODOLOGIA.map((fase) => (
                  <div key={fase.letra} className="doc-metodo-linha" style={{ "--fase": "var(--rp-" + fase.cor + ")" }}>
                    <span className="doc-metodo-nome"><b>{fase.letra}.</b> {fase.nome}</span>
                    <span className="doc-metodo-trilha">
                      {Array.from({ length: METODO_PASSOS }, (_, i) => (
                        <span key={i} className="doc-metodo-passo">
                          <span className={"doc-metodo-quadro" + (fase.passos.includes(i + 1) ? " ativo" : "")} />
                        </span>
                      ))}
                    </span>
                  </div>
                ))}
              </div>

              <div className="doc-metodo-etapas">
                {METODOLOGIA.map((fase) => (
                  <div key={fase.letra} className="doc-metodo-etapa" style={{ "--fase": "var(--rp-" + fase.cor + ")" }}>
                    <span className="doc-metodo-letra">{fase.letra}</span>
                    <p className="doc-metodo-txt">
                      <strong>{fase.titulo}</strong> {fase.texto}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {servicos.map((sv, i) => (
            <section key={i} className="doc-servico">
              <div className="doc-servico-header">
                <span className="doc-servico-num">{String(i + 1).padStart(2, "0")}</span>
                <span className="doc-servico-titulo">{sv.titulo}</span>
                <span className="doc-servico-prazo">{sv.prazo}</span>
                <span className="doc-servico-valor">
                  {formatarValor(parseFloat(sv.valor) || 0)}
                  {sv.parcelas && <span className="doc-servico-parcelas"> · {sv.parcelas}</span>}
                </span>
              </div>
              {sv.descricao && <p className="doc-servico-desc">{sv.descricao}</p>}
              <div className="doc-itens-lista">
                {sv.itens.filter((it) => it.rotulo || it.conteudo).map((it, j) => (
                  <div key={j} className="doc-item">
                    <span className="doc-item-rotulo">{it.rotulo}</span>
                    <span className="doc-item-conteudo">{it.conteudo}</span>
                  </div>
                ))}
              </div>
            </section>
          ))}

          <section className="doc-secao">
            <div className="doc-secao-label doc-secao-label--pink">cronograma</div>
            <div className="doc-cronograma-intro">
              O cronograma pode sofrer alterações de acordo com a necessidade, pacote escolhido e prazo do cliente, podendo ocasionar custos extras para prazos emergenciais.
            </div>
            <div>
              {cronograma.filter((e) => e.nome || e.duracao).map((e, i) => (
                <div key={i} className="doc-cronograma-linha">
                  <span className="doc-cronograma-etapa">{e.nome}</span>
                  <span className="doc-cronograma-duracao">{e.duracao}</span>
                </div>
              ))}
            </div>
          </section>

          <section className="doc-observacoes">
            <div className="doc-secao-label doc-secao-label--red">observações importantes</div>
            <div className="doc-obs-bloco">
              <strong className="doc-obs-titulo">acompanhamento gráfico</strong>
              <p className="doc-obs-txt">
                O percentual de acompanhamento gráfico é de 15% sobre o valor dos serviços dos fornecedores. Serve para que o cliente tenha suporte técnico especializado durante a produção em gráfica. A responsabilidade técnica da empresa de design ocorre somente até a aprovação da prova digital. Serviço opcional, mas de grande importância.
              </p>
            </div>
            <div className="doc-obs-bloco">
              <strong className="doc-obs-titulo">taxa de urgência</strong>
              <p className="doc-obs-txt">
                Ocorre quando os prazos para criação/editoração/layout são menores do que os habituais, ou quando o serviço demanda horas extras ou contratação extraordinária de profissionais.
              </p>
            </div>
            <div className="doc-obs-bloco">
              <strong className="doc-obs-titulo">validade da proposta</strong>
              <p className="doc-obs-txt">
                Esta proposta é válida por {validadeDias} dias a partir da data de emissão. Após esse período, os valores e prazos podem ser reajustados.
              </p>
            </div>
            <div className="doc-obs-bloco">
              <strong className="doc-obs-titulo">disposições gerais</strong>
              <p className="doc-obs-txt">
                Não estão inclusos: produção de conteúdo (textos, imagens), custos de impressão, distribuição, produção fotográfica e provas gráficas. Prazos contados a partir do primeiro pagamento. Mudanças conceituais no briefing após aprovação acarretam custos adicionais. Este orçamento engloba 1 (uma) alteração de layout. Arquivos digitais passam a ser propriedade do Cliente somente após o pagamento final.
              </p>
            </div>
          </section>

        </div>
      );
    }

    function PainelTemplates({ onAplicar }) {
      const [aberto, setAberto] = useState(null);
      const [marcados, setMarcados] = useState({});

      function abrir(template) {
        if (aberto === template.id) { setAberto(null); return; }
        const iniciais = {};
        template.modulos.forEach((m) => { iniciais[m.id] = m.padrao; });
        setMarcados(iniciais);
        setAberto(template.id);
      }

      const template = TEMPLATES.find((t) => t.id === aberto);
      const previa = template ? montarTemplate(template, marcados) : null;

      return (
        <div className="templates">
          <div className="templates-linha">
            <span className="templates-label">começar de um template</span>
            {TEMPLATES.map((t) => (
              <button key={t.id}
                      className={"btn-add" + (aberto === t.id ? " is-ativo" : "")}
                      onClick={() => abrir(t)}>
                {t.nome}
              </button>
            ))}
          </div>

          {template && (
            <div className="template-painel">
              <div className="template-modulos">
                {template.modulos.map((m) => (
                  <label key={m.id} className={"template-modulo" + (m.obrigatorio ? " is-fixo" : "")}>
                    <input type="checkbox"
                           checked={!!marcados[m.id]}
                           disabled={m.obrigatorio}
                           onChange={(e) => setMarcados({ ...marcados, [m.id]: e.target.checked })} />
                    <span className="template-modulo-txt">
                      <span className="template-modulo-rotulo">{m.rotulo}</span>
                      <span className="template-modulo-conteudo">{m.conteudo}</span>
                    </span>
                    <span className="template-modulo-dias">{m.dias}d</span>
                  </label>
                ))}
                {template.etapasFixas.map((e) => (
                  <div key={e.nome} className="template-modulo is-fixo">
                    <span className="template-modulo-txt">
                      <span className="template-modulo-rotulo">{e.nome}</span>
                      <span className="template-modulo-conteudo">sempre incluída</span>
                    </span>
                    <span className="template-modulo-dias">{e.dias}d</span>
                  </div>
                ))}
              </div>

              <div className="template-resumo">
                <div className="template-variante">{previa.servico.titulo}</div>
                <div className="template-prazo">
                  <span className="template-prazo-num">{previa.prazo}</span>
                  <span className="template-prazo-label">dias úteis</span>
                  {previa.diasBrutos !== previa.prazo && (
                    <span className="template-prazo-obs">soma {previa.diasBrutos}, arredondado pra cima</span>
                  )}
                </div>

                <div className="template-refs">
                  <div className="template-refs-label">o que você já cobrou</div>
                  {template.referencias.map((r, i) => (
                    <div key={i} className="template-ref">
                      <span>{r.cliente} · {r.ano}</span>
                      <span>{r.modulos} itens · {r.dias}d</span>
                      <span className="template-ref-valor">{formatarValor(r.valor)}</span>
                    </div>
                  ))}
                  <p className="template-refs-obs">
                    Valores de 2022 — servem de referência, não de preço. O campo de valor entra vazio de propósito.
                  </p>
                </div>

                <button className="btn-primario"
                        onClick={() => { onAplicar(previa.servico, previa.etapas); setAberto(null); }}>
                  adicionar à proposta
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AvisoErro({ erro, onFechar }) {
      let titulo, corpo, url;
      if (erro === "NAO_CONFIGURADO") {
        titulo = "Banco ainda não configurado";
        corpo = "Preencha SUPABASE_URL e SUPABASE_KEY no topo do index.html com os valores do banco provisionado no Vercel (Storage → o banco → Environment Variables), e rode supabase/schema.sql no SQL Editor.";
        url = SUPABASE_PAINEL_URL;
      } else if (erro === "ALLOWLIST") {
        titulo = "Acesso bloqueado pela allowlist do Supabase";
        corpo = "Seu projeto Supabase está com restrição de rede ativa. Acesse Settings → Network Restrictions no painel e libere o acesso.";
        url = SUPABASE_PAINEL_URL;
      } else if (erro === "CONEXAO_FALHOU") {
        titulo = "Falha ao conectar com o Supabase";
        corpo = "Não foi possível se comunicar com o banco. Verifique sua conexão de internet ou se o projeto está pausado.";
        url = SUPABASE_PAINEL_URL;
      } else {
        titulo = "Erro";
        corpo = erro;
      }
      return (
        <div className="aviso-erro">
          <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8}}>
            <strong className="aviso-erro-titulo">{titulo}</strong>
            <button onClick={onFechar} className="aviso-erro-fechar">×</button>
          </div>
          <p className="aviso-erro-texto">{corpo}</p>
          {url && <a href={url} target="_blank" rel="noopener noreferrer" className="aviso-erro-link">abrir painel do Supabase ↗</a>}
        </div>
      );
    }

    // Visao publica: ?p=<id> mostra so a proposta, sem o gerador.
    function TelaCompartilhada({ id }) {
      const [proposta, setProposta] = useState(null);
      const [erro, setErro] = useState(null);

      useEffect(() => {
        sb(`propostas_geradas?select=*&id=eq.${encodeURIComponent(id)}`)
          .then((linhas) => {
            if (!linhas.length) { setErro("NAO_ENCONTRADA"); return; }
            const p = linhas[0];
            setProposta({
              id: p.id, numeroFmt: p.numero_proposta, cliente: p.cliente,
              apresentacao: p.apresentacao, servicos: p.servicos || [],
              cronograma: p.cronograma || [], validadeDias: p.validade_dias,
              data: p.criado_em,
            });
            document.title = `Proposta ${p.numero_proposta} · ${p.cliente}`;
          })
          .catch((e) => setErro(e.message));
      }, [id]);

      if (erro === "NAO_ENCONTRADA") {
        return <div className="container"><h1>Proposta não encontrada</h1>
          <p style={{ color: "var(--rp-gray)" }}>O link pode estar incompleto ou a proposta foi removida.</p></div>;
      }
      if (erro) return <div className="container"><AvisoErro erro={erro} onFechar={() => setErro(null)} /></div>;
      if (!proposta) return <div className="container"><p style={{ color: "var(--rp-gray)" }}>carregando…</p></div>;

      return (
        <div>
          <div className="container no-print barra-compartilhada">
            <button className="btn-secundario" onClick={() => window.print()}>⎙ salvar em PDF</button>
          </div>
          <div className="container container-doc">
            <div className="preview-box">
              <div id="area-impressao">
                <PropostaRender {...proposta} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Raiz() {
      const id = new URLSearchParams(location.search).get("p");
      return id ? <TelaCompartilhada id={id} /> : <App />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Raiz />);
  </script>
</body>
</html>
